<style>
:root{--verde:#0f3d2e;--verde2:#16523e;--oro:#d4a537;--crema:#f6f1e4;--testo:#1c1c1c;--grigio:#6b7280;--rosso:#b3261e;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--crema);color:var(--testo);min-height:100vh;padding-bottom:80px}
h1,h2,h3{font-family:'Bebas Neue',sans-serif;letter-spacing:1px;font-weight:400}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 16px;font-weight:600}
input,select,textarea{font:inherit;width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;background:#fff;margin-bottom:10px}
textarea{min-height:140px;font-family:monospace;font-size:14px}
label{font-size:13px;font-weight:600;color:var(--grigio);display:block;margin-bottom:4px}
.btn{background:var(--verde);color:#fff}.btn-oro{background:var(--oro);color:var(--verde)}.btn-ghost{background:transparent;color:var(--verde);border:1px solid var(--verde)}.btn-rosso{background:var(--rosso);color:#fff}
.full{width:100%}.hidden{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.muted{color:var(--grigio);font-size:14px}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.msg{padding:10px;border-radius:10px;margin-bottom:10px;font-size:14px}.msg.err{background:#fde8e6;color:var(--rosso)}.msg.ok{background:#e3f4ea;color:var(--verde)}
/* AUTH */
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 20%,#2a2410,#000 70%)}
.auth-box{background:#fff;border-radius:18px;padding:26px;width:100%;max-width:400px}
.logo{text-align:center;margin-bottom:18px}.logo h1{font-size:46px;color:var(--verde);line-height:1}.logo h1 span{color:var(--oro)}.logo img{width:150px;height:150px;border-radius:50%;display:block;margin:0 auto 10px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
header .brand{display:flex;align-items:center;gap:10px}header .brand img{width:40px;height:40px;border-radius:50%}
.tabs{display:flex;gap:6px;margin-bottom:16px;background:#eef0ec;padding:4px;border-radius:12px}.tabs button{flex:1;background:transparent;color:var(--grigio)}.tabs button.on{background:#fff;color:var(--verde);box-shadow:0 1px 2px rgba(0,0,0,.1)}
/* HEADER */
header{background:var(--verde);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
header .in{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:30px}header h1 span{color:var(--oro)}
.user-chip{font-size:13px;background:rgba(255,255,255,.12);padding:6px 10px;border-radius:20px}
/* NAV */
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{background:none;color:var(--grigio);display:flex;flex-direction:column;align-items:center;font-size:10px;padding:6px 4px}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.match:last-child{border-bottom:0}.match .u{font-weight:600}.match .u.r{text-align:right}.match .sc{font-family:'Bebas Neue';font-size:24px;color:var(--verde);text-align:center;min-width:64px}.match .win{color:#8a6200}.match .lose{color:var(--grigio);text-decoration:line-through}
nav button .i{font-size:22px}nav button.on{color:var(--verde)}
/* CORSE */
.giornata-head{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px}.giornata-head h2{font-size:26px;color:var(--verde)}
.corsa-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.corsa-top h3{font-size:22px;color:var(--verde)}
.badge{font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;white-space:nowrap}
.b-aperta{background:#e3f4ea;color:var(--verde)}.b-chiusa{background:#fff4d6;color:#8a6200}.b-fine{background:#e5e7eb;color:#374151}
.partenti{display:grid;gap:6px;margin:8px 0}
.partente{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid #e5e7eb;border-radius:10px;font-size:14px}
.num{width:30px;height:30px;border-radius:8px;background:var(--verde);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 30px}
.partente .drv{color:var(--grigio);font-size:12px}
.partente .pos{margin-left:auto;font-weight:800;color:var(--oro)}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.arrivo{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.arrivo .a{background:var(--verde);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600}
.arrivo .a:first-child{background:var(--oro);color:var(--verde)}
.punti{font-family:'Bebas Neue';font-size:28px;color:var(--oro)}
/* CLASSIFICA */
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 6px;text-align:left;border-bottom:1px solid #eee}th{font-size:12px;color:var(--grigio);text-transform:uppercase}
td.n{text-align:right;font-weight:700}tr.me{background:#fff8e6}
.pos1{color:var(--oro);font-weight:800}
.hero{background:linear-gradient(135deg,var(--verde),var(--verde2));color:#fff;border-radius:16px;padding:18px;margin-bottom:14px}
.hero h2{font-size:30px}.hero .big{font-family:'Bebas Neue';font-size:52px;color:var(--oro);line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stats div{background:rgba(255,255,255,.1);border-radius:10px;padding:8px;text-align:center}.stats b{display:block;font-size:20px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:10px}.chk{display:flex;align-items:center;gap:6px;font-weight:400;color:var(--testo);font-size:13px;margin:0}.chk input{width:auto;margin:0}
.regole li{margin:6px 0 6px 18px;font-size:15px}
</style>

<!-- ================= LOGIN / REGISTRAZIONE ================= -->
<section id="auth" class="hidden">
  <div class="auth-box">
    <div class="logo"><img src="" class="logoT10" alt="T10"><h1>FANTA<span>TROTTO</span></h1><p class="muted">Il fanta gioco del trotto italiano</p></div>
    <div class="tabs"><button id="tabLogin" class="on" onclick="setTab('login')">Accedi</button><button id="tabReg" onclick="setTab('reg')">Registrati</button></div>
    <div id="iscrInfo"></div>
    <div id="authMsg"></div>
    <form id="formLogin" onsubmit="login(event)">
      <label>Email</label><input type="email" id="lEmail" required autocomplete="email">
      <label>Password</label><input type="password" id="lPass" required autocomplete="current-password">
      <button class="btn full" type="submit">Entra</button>
      <p style="text-align:center;margin-top:12px"><a href="#" onclick="resetPass(event)" class="muted">Password dimenticata?</a></p>
    </form>
    <form id="formReg" class="hidden" onsubmit="register(event)">
      <label>Nome utente</label><input id="rUser" required minlength="3" maxlength="20" placeholder="es. Varenne93">
      <label>Email</label><input type="email" id="rEmail" required autocomplete="email">
      <label>Password (min 6 caratteri)</label><input type="password" id="rPass" required minlength="6" autocomplete="new-password">
      <button class="btn-oro full" type="submit">Crea account</button>
    </form>
  </div>
</section>

<!-- ================= APP ================= -->
<section id="app" class="hidden">
  <header><div class="in"><div class="brand"><img src="" class="logoT10" alt="T10"><h1>FANTA<span>TROTTO</span></h1></div><span class="user-chip" id="chip"></span></div></header>
  <main class="wrap">
    <div id="pg-home"></div>
    <div id="pg-corse" class="hidden"></div>

    <div id="pg-regole" class="hidden"></div>
    <div id="pg-scontri" class="hidden"></div>

document.querySelectorAll('.logoT10').forEach(i => i.src = LOGO);
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let me = null, profilo = null, giornate = [], corse = [], miei = {}, scontri = [], utenti = {};
const CORSE_CLASSIFICA = 10;
const NOMI_TURNO = {8:'Ottavi di finale', 4:'Quarti di finale', 2:'Semifinali', 1:'Finale'};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtData = d => new Date(d).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'});
const fmtOra = d => new Date(d).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
const chiusura = c => new Date(new Date(c.orario).getTime() - 3600000); // pronostici chiusi 1 ora prima
const stato = c => c.arrivo?.length ? 'fine' : (chiusura(c) <= new Date() ? 'chiusa' : 'aperta');
const nomeCav = (c,n) => '';
const numeri = t => String(t||'').split(/[^0-9]+/).filter(Boolean).map(Number);
// Tempo al km in decimi di secondo: 1'12"1 -> 721
function parseTempo(s){
  const m = String(s||'').trim().match(/^(\d)\D+(\d{1,2})\D+(\d)\D*$/) || String(s||'').trim().match(/^(\d)(\d{2})(\d)$/);
  if (!m) return null; const sec = +m[2]; if (sec > 59) return null;
  return (+m[1])*600 + sec*10 + (+m[3]);
}
const fmtTempo = d => d==null ? '' : `${Math.floor(d/600)}'${String(Math.floor((d%600)/10)).padStart(2,'0')}"${d%10}`;
const fmtDiff = d => d==null ? '-' : (d/10).toFixed(1).replace('.',',') + '"';
function effettivi(p, c){
  const e = [p.primo, p.secondo, p.terzo], rit = c.ritirati || []; let usata = false;
  for (let i=0;i<3;i++) if (e[i]!=null && rit.includes(e[i]) && !usata && p.riserva!=null && !rit.includes(p.riserva)) { e[i] = p.riserva; usata = true; }
  return e;
}

function msg(el, testo, tipo='err'){ $(el).innerHTML = testo ? `<div class="msg ${tipo}">${esc(testo)}</div>` : ''; }

// ---------- AUTH ----------
function setTab(t){
  $('tabLogin').classList.toggle('on', t==='login'); $('tabReg').classList.toggle('on', t==='reg');
  $('formLogin').classList.toggle('hidden', t!=='login'); $('formReg').classList.toggle('hidden', t!=='reg'); msg('authMsg','');
}
async function login(e){
  e.preventDefault(); msg('authMsg','');
  const { error } = await sb.auth.signInWithPassword({ email: $('lEmail').value.trim(), password: $('lPass').value });
  if (error) msg('authMsg', error.message.includes('Invalid') ? 'Email o password errati' : error.message.includes('confirm') ? 'Conferma prima la tua email (controlla la posta)' : error.message);
}
async function register(e){
  e.preventDefault(); msg('authMsg','');
  const username = $('rUser').value.trim();
  await caricaImpostazioni();
  const st = statoIscrizioni();
  if (st === 'prima') return msg('authMsg', 'Iscrizioni non ancora aperte: aprono ' + fmtDataOra(imp.iscrizioni_apertura));
  if (st === 'chiuse') return msg('authMsg', 'Iscrizioni chiuse: il gioco è già iniziato. Potrai iscriverti alla prossima edizione.');
  const { data: libero } = await sb.rpc('username_libero', { u: username });
  if (libero === false) return msg('authMsg','Nome utente già preso');
  const { data, error } = await sb.auth.signUp({ email: $('rEmail').value.trim(), password: $('rPass').value, options: { data: { username }, emailRedirectTo: location.origin + location.pathname } });
  if (error) return msg('authMsg', error.message.includes('registered') ? 'Email già registrata' : error.message.includes('Database error') ? 'Iscrizioni chiuse: non è possibile registrarsi ora.' : error.message);
  if (!data.session) { setTab('login'); msg('authMsg','Account creato! Controlla la tua email per confermare, poi accedi.','ok'); }
}
async function resetPass(e){
  e.preventDefault();
  const email = $('lEmail').value.trim();
  if (!email) return msg('authMsg','Scrivi prima la tua email nel campo sopra');
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  msg('authMsg', error ? error.message : 'Ti abbiamo mandato una email per reimpostare la password', error ? 'err' : 'ok');
}
async function logout(){ await sb.auth.signOut(); }

sb.auth.onAuthStateChange(async (ev, session) => {
  if (ev === 'PASSWORD_RECOVERY') {
    const np = prompt('Scrivi la nuova password (min 6 caratteri)');
    if (np) { const { error } = await sb.auth.updateUser({ password: np }); alert(error ? error.message : 'Password aggiornata!'); }
  }
  if (session?.user) { if (me?.id !== session.user.id) { me = session.user; await avvia(); } }
  else { me = null; $('app').classList.add('hidden'); $('auth').classList.remove('hidden'); mostraIscrizioni(); }
});

// ---------- ISCRIZIONI ----------
let imp = {};
const fmtDataOra = d => new Date(d).toLocaleString('it-IT', { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
async function caricaImpostazioni(){ const { data } = await sb.from('impostazioni').select('*').eq('id', 1).maybeSingle(); imp = data || {}; }
function statoIscrizioni(){
  const now = new Date();
  if (imp.iscrizioni_apertura && now < new Date(imp.iscrizioni_apertura)) return 'prima';
  if (imp.iscrizioni_chiusura && now > new Date(imp.iscrizioni_chiusura)) return 'chiuse';
  return 'aperte';
}
async function mostraIscrizioni(){
  await caricaImpostazioni();

function calcPunti(p, c){

function seedOrder(n){ let a = [1]; while (a.length < n) { const m = a.length*2 + 1; a = a.flatMap(x => [x, m-x]); } return a; }
function turni(){ const t = {}; scontri.forEach(s => (t[s.turno] ??= []).push(s)); return t; }
function cardMatch(m){

async function generaTabellone(){
  const { data: cl } = await sb.from('classifica').select('*').order('punti',{ascending:false}).order('vincenti',{ascending:false});
  const lista = cl || []; let N = 16; while (N > lista.length) N /= 2;
  if (N < 2) return msg('sMsg','Servono almeno 2 iscritti');
  const fatte = corse.filter(c => c.fase !== 'scontri' && c.arrivo?.length).length;
  if (!confirm(`Creare il tabellone con i primi ${N} della classifica?${fatte < CORSE_CLASSIFICA ? `\n\nAttenzione: corse a classifica concluse ${fatte}/${CORSE_CLASSIFICA}.` : ''}`)) return;
  const seeds = seedOrder(N), righe = [];
  for (let i = 0; i < N/2; i++) righe.push({ turno: 1, slot: i, user1: lista[seeds[2*i]-1].user_id, user2: lista[seeds[2*i+1]-1].user_id });
  const { error } = await sb.from('scontri').insert(righe);
  if (error) return msg('sMsg', error.message);
  await carica(); renderAdmin();
}
async function assegnaCorsa(k){
  const id = +$('sCorsa').value; if (!id) return msg('sMsg','Scegli la corsa');
  const { error } = await sb.from('scontri').update({ corsa_id: id }).eq('turno', k);
  if (error) return msg('sMsg', error.message);
  await carica(); renderAdmin(); msg('sMsg','Corsa assegnata ✅','ok');
}
function esito(r1, r2){
  // chi è più vicino al tempo ufficiale; a pari distanza chi ha inserito prima
  const key = r => r && r.diff_tempo != null ? [r.diff_tempo, new Date(r.updated_at).getTime()] : [1e12, 1e15];
  const k1 = key(r1), k2 = key(r2), t1 = k1[0] < k2[0] || (k1[0] === k2[0] && k1[1] <= k2[1]);
  const p1 = (r1?.punti || 0) + (t1 && r1 ? 3 : 0), p2 = (r2?.punti || 0) + (!t1 && r2 ? 3 : 0);
  return { p1, p2, w: p1 > p2 ? 1 : p2 > p1 ? 2 : (t1 ? 1 : 2) };
}
async function calcolaTurno(k){
  const ms = turni()[k], cid = ms[0].corsa_id, c = corse.find(x => x.id === cid);
  if (!c) return msg('sMsg','Prima assegna la corsa al turno');
  if (!c.arrivo?.length) return msg('sMsg','Inserisci prima l\'arrivo ufficiale di quella corsa');
  const { data } = await sb.from('pronostici_punti').select('*').eq('corsa_id', cid);
  const pr = {}; (data || []).forEach(r => pr[r.user_id] = r);
  const vincitori = [];
  for (const m of ms) {
    const e = esito(pr[m.user1], pr[m.user2]); const w = e.w === 1 ? m.user1 : m.user2; vincitori[m.slot] = w;
    const { error } = await sb.from('scontri').update({ punti1: e.p1, punti2: e.p2, vincitore: w }).eq('id', m.id);
    if (error) return msg('sMsg', error.message);
  }
  if (ms.length > 1) {
    const righe = []; for (let j = 0; j < ms.length/2; j++) righe.push({ turno: k+1, slot: j, user1: vincitori[2*j], user2: vincitori[2*j+1] });
    const { error } = await sb.from('scontri').upsert(righe, { onConflict: 'turno,slot' });
    if (error) return msg('sMsg', error.message);
  }
  await carica(); renderAdmin();
}
async function resetTabellone(){
  if (!confirm('Cancellare tutto il tabellone degli scontri diretti?')) return;
  await sb.from('scontri').delete().gt('id', 0); await carica(); renderAdmin();
}

  $('pg-regole').innerHTML = `<div class="card regole">
  <div style="text-align:center"><h2 style="color:var(--verde);font-size:40px;line-height:1">T10</h2><h2 style="color:var(--oro);font-size:28px">CHAMPIONS LEAGUE</h2><p class="muted">Regolamento Ufficiale FantaTrotto • Stagione 2026/2027</p></div>
  ${h('Formula')}<ul><li><b>Fase 1 – Classifica:</b> ${CORSE_CLASSIFICA} corse, punti sommati in classifica generale.</li><li><b>Fase 2 – Scontri diretti:</b> passano i migliori della classifica, il più possibile in base agli iscritti: 16 (ottavi), 8 (quarti), 4 (semifinali) o 2 (finale).</li><li>Accoppiamenti: 1° contro l'ultimo qualificato, 2° contro il penultimo e così via. Ogni turno si gioca su una corsa: chi fa più punti passa il turno.</li></ul>
  ${h('Come si gioca')}<ul><li>Per ogni corsa reale scegli 1°, 2°, 3°, una riserva e il tempo al km del vincitore (es. 1'12"1).</li><li>Puoi cambiare il pronostico fino a <b>1 ora prima</b> della partenza ufficiale.</li><li>I pronostici di tutti sono sempre visibili.</li></ul></div>

  <div class="card regole"><h2 style="color:var(--verde);font-size:30px">🏆 Classifica</h2>
  <table style="margin-top:8px"><tr><th>Risultato</th><th class="n">Punti</th></tr>
  <tr><td>1° esatto</td><td class="n">+10</td></tr><tr><td>2° esatto</td><td class="n">+7</td></tr><tr><td>3° esatto</td><td class="n">+5</td></tr>
  <tr><td>Piazzato fuori ordine</td><td class="n">+3</td></tr><tr><td>Squalifica per rottura</td><td class="n" style="color:var(--rosso)">-3</td></tr>
  <tr style="background:#fff8e6"><td><b>BONUS EXTRA (Vincente + Tempo al km esatto)</b></td><td class="n">+20</td></tr></table>
  ${h('1. Punteggio piazzamento')}<ul><li>1° esatto = <b>10 punti</b> | 2° esatto = <b>7 punti</b> | 3° esatto = <b>5 punti</b></li><li>Piazzato fuori ordine (es. dai 3° e arriva 1°) = <b>3 punti</b></li></ul>
  ${h('2. Riserva')}<ul><li>Se un titolare è ritirato, entra la riserva al suo posto.</li><li>La riserva prende i punti normali.</li></ul>
  ${h('3. Squalifica per rottura')}<ul><li>Cavallo squalificato per rottura di camminata = <b>-3 punti</b></li></ul>
  ${h('4. Bonus extra 20 punti')}<ul><li>Se indovini il <b>vincente</b> e il <b>tempo al km esatto</b> = <b>+20 punti extra</b>.</li><li>Il tempo deve essere identico a quello ufficiale (es. pronostico 1'12"1, reale 1'12"1).</li></ul></div>

  <div class="card regole"><h2 style="color:var(--verde);font-size:30px">⚔️ Scontri diretti</h2>
  <table style="margin-top:8px"><tr><th>Risultato</th><th class="n">Punti</th></tr>
  <tr><td>Punteggio piazzamento, riserva e rottura</td><td class="n">come in classifica</td></tr>
  <tr><td>Bonus Tempo al km</td><td class="n">+3</td></tr></table>
  ${h('1. Bonus tempo al km')}<ul><li><b>Bonus +3:</b> nello scontro diretto, chi si avvicina di più al tempo reale vince il bonus.</li></ul>
  ${h('2. Spareggio')}<ul><li>A parità di punteggio vince chi è più vicino al tempo ufficiale.</li><li>Se i due utenti sono alla <b>stessa distanza</b> dal tempo ufficiale (es. uno 1 decimo in meno e l'altro 1 decimo in più) o hanno messo lo stesso tempo, vince <b>chi ha inserito il pronostico per primo</b>.</li><li>Vale l'orario dell'ultimo salvataggio: chi modifica il pronostico prende il nuovo orario.</li></ul></div>`;
}

// ---------- ADMIN ----------
function renderAdmin(){
  if (!profilo.is_admin) return;
  const optG = giornate.map(g => `<option value="${g.id}">${esc(g.nome)} (${fmtData(g.data)})</option>`).join('');
  const daChiudere = corse.filter(c => !c.arrivo?.length && new Date(c.orario) <= new Date());
  $('pg-admin').innerHTML = `<h2 style="color:var(--verde);font-size:28px;margin-bottom:8px">⚙️ Pannello commissario</h2>
  <div class="card"><h3 style="font-size:22px">📝 Iscrizioni al gioco</h3>
    <p class="muted" style="margin-bottom:8px">Fuori da queste date nessuno può registrarsi. Lascia vuoto per non mettere limiti.</p>
    <label>Nome del gioco</label><input id="iNome" placeholder="es. T10 Champions League" value="${esc(imp.nome_gioco||'')}">
    <label>Apertura iscrizioni</label><input type="datetime-local" id="iA" value="${toLocalInput(imp.iscrizioni_apertura)}">
    <label>Chiusura iscrizioni</label><input type="datetime-local" id="iC" value="${toLocalInput(imp.iscrizioni_chiusura)}">
    <p class="muted">Stato attuale: <b>${{prima:'non ancora aperte',aperte:'aperte',chiuse:'chiuse'}[statoIscrizioni()]}</b> · utenti iscritti: <b>${Object.keys(utenti).length}</b></p>
    <div id="iMsg"></div><button class="btn full" onclick="salvaIscrizioni()">Salva iscrizioni</button></div>
  <div class="card"><h3 style="font-size:22px">1. Nuova giornata</h3>
    <label>Nome</label><input id="gNome" placeholder="es. Giornata 1 - Domenica di trotto">
    <label>Data</label><input type="date" id="gData">
    <div id="gMsg"></div><button class="btn full" onclick="nuovaGiornata()">Crea giornata</button></div>
  <div class="card"><h3 style="font-size:22px">2. Aggiungi corsa reale</h3>
    <label>Giornata</label><select id="cG">${optG || '<option value="">Crea prima una giornata</option>'}</select>
    <div class="row"><div><label>Ippodromo</label><input id="cIpp" placeholder="es. San Siro"></div><div style="flex:0 0 90px"><label>N° corsa</label><input type="number" id="cNum" value="1" min="1"></div></div>
    <label>Fase</label><select id="cFase"><option value="classifica">🏆 Classifica (prime ${CORSE_CLASSIFICA} corse)</option><option value="scontri">⚔️ Scontri diretti</option></select>
    <label>Nome premio</label><input id="cNome" placeholder="es. Premio Gaida - Corsa Tris">
    <label>Data e ora di partenza ufficiale (i pronostici chiudono 1 ora prima)</label><input type="datetime-local" id="cOra">
    <div id="cMsg"></div><button class="btn full" onclick="nuovaCorsa()">Aggiungi corsa</button></div>
  <div class="card"><h3 style="font-size:22px">3. Inserisci arrivo ufficiale</h3>
    ${daChiudere.length ? daChiudere.map(c => `<div style="border-top:1px solid #eee;padding-top:10px;margin-top:10px"><b>${c.numero}ª ${esc(c.ippodromo)}</b> <span class="muted">${esc(c.nome)}</span>
      <div class="picks" style="margin-top:6px">${[1,2,3].map(k=>`<div><label>${k}° arrivato</label><input type="number" inputmode="numeric" min="1" max="30" id="a${k}-${c.id}" placeholder="n°"></div>`).join('')}</div>
      <label>⏱ Tempo al km ufficiale del vincitore</label><input id="at-${c.id}" placeholder="1'12&quot;1">
      <label>Ritirati (numeri separati da virgola)</label><input id="ar-${c.id}" inputmode="numeric" placeholder="es. 4, 11" value="${(c.ritirati||[]).join(', ')}">
      <label>Squalificati per rottura (numeri separati da virgola)</label><input id="ao-${c.id}" inputmode="numeric" placeholder="es. 7" value="${(c.rotture||[]).join(', ')}">
      <button class="btn-oro full" onclick="salvaArrivo(${c.id})">Conferma arrivo</button></div>`).join('') : '<p class="muted">Nessuna corsa in attesa di arrivo.</p>'}</div>
  ${adminScontri()}
  <div class="card"><h3 style="font-size:22px">Gestisci corse</h3>
    ${corse.length ? corse.slice().reverse().map(c => `<div class="row" style="border-bottom:1px solid #eee;padding:8px 0"><div style="flex:3"><b>${c.numero}ª ${esc(c.ippodromo)}</b><div class="muted">${c.fase==='scontri'?'⚔️':'🏆'} ${fmtData(c.orario)} ${fmtOra(c.orario)} · ${c.arrivo?.length?'arrivo: '+c.arrivo.join('-'):'senza arrivo'}</div></div>
      ${c.arrivo?.length?`<button class="btn-ghost" style="flex:0" onclick="annullaArrivo(${c.id})">↺</button>`:''}<button class="btn-rosso" style="flex:0" onclick="eliminaCorsa(${c.id})">🗑</button></div>`).join('') : '<p class="muted">Nessuna corsa.</p>'}</div>`;
}
async function nuovaGiornata(){
  const nome = $('gNome').value.trim(), data = $('gData').value;
  if (!nome || !data) return msg('gMsg','Compila nome e data');
  const { error } = await sb.from('giornate').insert({ nome, data });
  if (error) return msg('gMsg', error.message);
  await carica(); renderAdmin(); msg('gMsg','Giornata creata ✅','ok');
}
function leggiPartenti(txt){
  return txt.split('\n').map(r => r.trim()).filter(Boolean).map(r => {
    const m = r.match(/^(\d+)[\s.)\-]+(.+)$/); if (!m) return null;
    const [cav, ...drv] = m[2].split(/\s+-\s+|\s+–\s+/);
    return { n: +m[1], cavallo: cav.trim(), driver: drv.join(' - ').trim() };
  }).filter(Boolean);
}
async function nuovaCorsa(){
  const g = $('cG').value, ora = $('cOra').value, ipp = $('cIpp').value.trim();
  if (!g || !ora || !ipp) return msg('cMsg','Compila giornata, ippodromo e orario');
  const { error } = await sb.from('corse').insert({ giornata_id: +g, ippodromo: ipp, numero: +$('cNum').value || 1, nome: $('cNome').value.trim(), orario: new Date(ora).toISOString(), partenti: [], fase: $('cFase').value });
  if (error) return msg('cMsg', error.message);
  await carica(); renderAdmin(); msg('cMsg', 'Corsa aggiunta ✅', 'ok');
}
async function salvaArrivo(id){
  const a = [1,2,3].map(k => +$(`a${k}-${id}`).value).filter(Boolean);
  if (a.length < 3 || new Set(a).size !== 3) return alert('Scrivi i numeri di 1°, 2° e 3° (tutti diversi)');
  const tempo_ufficiale = parseTempo($('at-'+id).value);
  if (tempo_ufficiale == null) return alert('Scrivi il tempo ufficiale così: 1\'12"1');
  const ritirati = numeri($('ar-'+id).value);
  const rotture = numeri($('ao-'+id).value);
  const { error } = await sb.from('corse').update({ arrivo: a, tempo_ufficiale, ritirati, rotture }).eq('id', id);
  if (error) return alert(error.message); await carica(); renderAdmin();
}
async function annullaArrivo(id){ if (!confirm('Annullare l\'arrivo di questa corsa?')) return; await sb.from('corse').update({ arrivo: null, tempo_ufficiale: null, ritirati: [], rotture: [] }).eq('id', id); await carica(); renderAdmin(); }
async function eliminaCorsa(id){ if (!confirm('Eliminare la corsa e tutti i suoi pronostici?')) return; await sb.from('corse').delete().eq('id', id); await carica(); renderAdmin(); }
</script>
</body>
</html>
