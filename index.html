<style>
:root{--verde:#0f3d2e;--verde2:#16523e;--oro:#d4a537;--crema:#f6f1e4;--testo:#1c1c1c;--grigio:#6b7280;--rosso:#b3261e;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--crema);color:var(--testo);min-height:100vh;padding-bottom:80px}
header .area-sw{max-width:720px;margin:10px auto 0;display:flex;background:rgba(0,0,0,.25);border-radius:12px;padding:4px;gap:4px}
header .area-sw button{flex:1;background:transparent;color:rgba(255,255,255,.75);padding:10px 4px;font-size:12px;letter-spacing:.3px;border-radius:9px;white-space:nowrap}
header .area-sw button.on{background:var(--oro);color:#111;box-shadow:0 2px 6px rgba(0,0,0,.3)}
body.area-mercato header{background:linear-gradient(135deg,#2b1a0b,#4a2f14)}
body.area-mercato{--verde:#5a3a17}
.avviso-mercato{background:#fff8e6;border:1px solid #e9c463;border-left:5px solid #b8862b;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.galleria{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;border-radius:12px;margin-bottom:8px}
.galleria img,.galleria video{flex:0 0 100%;width:100%;max-height:60vh;object-fit:cover;scroll-snap-align:center;border-radius:12px;background:#000}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.thumbs div{position:relative;width:64px;height:64px;border-radius:8px;background:#111 center/cover no-repeat}
.thumbs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;padding:0;background:var(--rosso);color:#fff;font-size:12px}
#modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));position:relative}
.modal-x{position:absolute;top:10px;right:12px;background:#f3f4f6;border-radius:50%;width:36px;height:36px;padding:0;font-size:18px}
.contatti{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.contatti a{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;border-radius:12px;text-decoration:none;font-weight:700;background:var(--verde);color:#fff}
.contatti a.wa{background:#1fa855}.contatti a.alt{background:#fff;color:var(--verde);border:1px solid var(--verde)}
.badge-all{display:inline-block;background:linear-gradient(90deg,#b8862b,#f5d77e);color:#111;font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;letter-spacing:.5px}
.pul{overflow:hidden;padding:0}.pul .ft{height:200px;background:#111 center/cover no-repeat;position:relative}.pul .ft .venduto{position:absolute;top:12px;left:-30px;transform:rotate(-30deg);background:var(--rosso);color:#fff;font-weight:800;padding:4px 40px}
.pul .bd{padding:14px}.pul h3{font-size:26px;color:var(--verde)}.pul .prz{font-family:'Bebas Neue';font-size:26px;color:#8a6200}
.chips{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.chips button{background:#fff;border:1px solid #d1d5db;color:var(--testo);padding:8px 12px;white-space:nowrap}.chips button.on{background:var(--verde);color:#fff;border-color:var(--verde)}
.allev{display:flex;gap:10px;overflow:auto;padding-bottom:4px}.allev div{flex:0 0 92px;text-align:center;cursor:pointer}.allev img,.allev .ini{width:72px;height:72px;border-radius:50%;object-fit:contain;background:#fff;border:3px solid var(--oro);margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue';font-size:28px;color:var(--oro);background:#111}.allev img{background:#fff}.allev span{font-size:12px;font-weight:700}
body.has-sponsor{padding-bottom:110px}
body.is-admin #sponsorBar{left:60px}
#adminBtn{position:fixed;left:0;bottom:0;z-index:8;width:60px;height:calc(88px + env(safe-area-inset-bottom));padding:0 0 env(safe-area-inset-bottom);border-radius:0;background:#111;color:#e9c463;font-size:26px;border-top:3px solid #111;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#adminBtn small{font-size:9px;letter-spacing:1px;color:#e9c463}
#menuTendina{max-width:720px;margin:6px auto 0;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);overflow:hidden}
#menuTendina button{display:flex;align-items:center;gap:12px;width:100%;background:#fff;color:var(--testo);border-radius:0;border-bottom:1px solid #eee;padding:14px 16px;font-size:16px;text-align:left}
#menuTendina button:last-child{border-bottom:0}#menuTendina button.on{background:#fff8e6;color:#8a6200}
#menuTendina .i{font-size:22px;width:28px;text-align:center}
.porta{display:block;border-radius:18px;padding:20px;margin-bottom:14px;color:#fff;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.porta.g{background:linear-gradient(135deg,#0f3d2e,#1d6a4f)}.porta.m{background:linear-gradient(135deg,#2b1a0b,#6b4520)}
.porta h2{font-size:34px;color:#f5d77e;line-height:1}.porta p{opacity:.9;margin-top:6px;font-size:14px}.porta .ico{position:absolute;right:14px;top:10px;font-size:64px;opacity:.25}
.porta .go{display:inline-block;margin-top:12px;background:#e9c463;color:#111;font-weight:800;padding:9px 16px;border-radius:10px}
.porta .st{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.porta .st span{background:rgba(255,255,255,.12);padding:5px 10px;border-radius:8px;font-size:13px}
#sponsorBar{position:fixed;left:0;right:0;z-index:7;bottom:0;padding-bottom:env(safe-area-inset-bottom);height:calc(88px + env(safe-area-inset-bottom));overflow:hidden;
  background:linear-gradient(90deg,#8a5f12,#e9c463 25%,#fff0b8 50%,#e9c463 75%,#8a5f12);border-top:3px solid #111;border-bottom:1px solid #111;box-shadow:0 -6px 18px rgba(0,0,0,.35)}
#sponsorBar.su-auth{bottom:0;height:calc(88px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
#sponsorBar::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);animation:sp-shine 4s ease-in-out infinite;pointer-events:none}
@keyframes sp-shine{0%,55%{left:-40%}100%{left:120%}}
#sponsorBar .sp-track{display:flex;width:max-content;height:88px;align-items:center;animation:sp-scroll linear infinite}
#sponsorBar:active .sp-track{animation-play-state:paused}
@keyframes sp-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
#sponsorBar a{display:flex;align-items:center;gap:12px;color:#111;text-decoration:none;padding:0 26px;height:88px;white-space:nowrap}
#sponsorBar a::after{content:"◆";margin-left:26px;color:#111;font-size:12px;opacity:.6}
#sponsorBar img,#sponsorBar .sp-ini{width:76px;height:76px;border-radius:50%;object-fit:contain;background:#fff;border:3px solid #111;box-shadow:0 2px 6px rgba(0,0,0,.35)}
#sponsorBar .sp-ini{display:flex;align-items:center;justify-content:center;background:#111;color:#e9c463;font-family:'Bebas Neue';font-size:36px}
#sponsorBar .sp-t{display:block;font-size:10px;font-weight:800;letter-spacing:2px;color:#5a3d00}
#sponsorBar .sp-n{display:block;font-family:'Bebas Neue';font-size:30px;line-height:1;letter-spacing:1px;color:#111}
h1,h2,h3{font-family:'Bebas Neue',sans-serif;letter-spacing:1px;font-weight:400}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 16px;font-weight:600}
input,select,textarea{font:inherit;width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;background:#fff;margin-bottom:10px}
textarea{min-height:140px;font-family:monospace;font-size:14px}
label{font-size:13px;font-weight:600;color:var(--grigio);display:block;margin-bottom:4px}
.btn{background:var(--verde);color:#fff}.btn-oro{background:var(--oro);color:var(--verde)}.btn-ghost{background:transparent;color:var(--verde);border:1px solid var(--verde)}.btn-rosso{background:var(--rosso);color:#fff}
.full{width:100%}.hidden{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.muted{color:var(--grigio);font-size:14px}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.msg{padding:10px;border-radius:10px;margin-bottom:10px;font-size:14px}.msg.err{background:#fde8e6;color:var(--rosso)}.msg.ok{background:#e3f4ea;color:var(--verde)}
/* AUTH */
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 20%,#2a2410,#000 70%)}
.auth-box{background:#fff;border-radius:18px;padding:26px;width:100%;max-width:400px}
.logo{text-align:center;margin-bottom:18px}.logo h1{font-size:46px;color:var(--verde);line-height:1}.logo h1 span{color:var(--oro)}.logo img{width:240px;max-width:80%;height:auto;display:block;margin:0 auto 6px}
header .brand{display:flex;align-items:center;gap:10px}header .brand img{width:38px;height:auto}
.tabs{display:flex;gap:6px;margin-bottom:16px;background:#eef0ec;padding:4px;border-radius:12px}.tabs button{flex:1;background:transparent;color:var(--grigio)}.tabs button.on{background:#fff;color:var(--verde);box-shadow:0 1px 2px rgba(0,0,0,.1)}
/* HEADER */
header{background:var(--verde);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
header .in{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:30px}
.online-list{background:#fff;color:var(--testo);border-radius:12px;padding:10px 14px;box-shadow:0 4px 14px rgba(0,0,0,.2)}.online-list div{padding:6px 0;border-bottom:1px solid #eee;font-size:14px}.online-list div:last-child{border:0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#22c55e;margin-right:8px}header h1 span{color:var(--oro)}
.user-chip{font-size:13px;background:rgba(255,255,255,.12);padding:6px 10px;border-radius:20px}
/* NAV */
nav{display:none!important;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{background:none;color:var(--grigio);display:flex;flex-direction:column;align-items:center;font-size:10px;padding:6px 4px}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.match:last-child{border-bottom:0}.match .u{font-weight:600}.match .u.r{text-align:right}.match .sc{font-family:'Bebas Neue';font-size:24px;color:var(--verde);text-align:center;min-width:64px}.match .win{color:#8a6200}.match .lose{color:var(--grigio);text-decoration:line-through}
nav button .i{font-size:22px}nav button.on{color:var(--verde)}
/* CORSE */
.giornata-head{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px}.giornata-head h2{font-size:26px;color:var(--verde)}
.corsa-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.corsa-top h3{font-size:22px;color:var(--verde)}
.badge{font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;white-space:nowrap}
.b-aperta{background:#e3f4ea;color:var(--verde)}.b-chiusa{background:#fff4d6;color:#8a6200}.b-fine{background:#e5e7eb;color:#374151}
.partenti{display:grid;gap:6px;margin:8px 0}
.partente{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid #e5e7eb;border-radius:10px;font-size:14px}
.num{width:30px;height:30px;border-radius:8px;background:var(--verde);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 30px}
.partente .drv{color:var(--grigio);font-size:12px}
.partente .pos{margin-left:auto;font-weight:800;color:var(--oro)}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.arrivo{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.arrivo .a{background:var(--verde);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600}
.arrivo .a:first-child{background:var(--oro);color:var(--verde)}
.punti{font-family:'Bebas Neue';font-size:28px;color:var(--oro)}
/* CLASSIFICA */
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 6px;text-align:left;border-bottom:1px solid #eee}th{font-size:12px;color:var(--grigio);text-transform:uppercase}
td.n{text-align:right;font-weight:700}tr.me{background:#fff8e6}
.pos1{color:var(--oro);font-weight:800}
.hero{background:linear-gradient(135deg,var(--verde),var(--verde2));color:#fff;border-radius:16px;padding:18px;margin-bottom:14px}
.hero h2{font-size:30px}.hero .big{font-family:'Bebas Neue';font-size:52px;color:var(--oro);line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stats div{background:rgba(255,255,255,.1);border-radius:10px;padding:8px;text-align:center}.stats b{display:block;font-size:20px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:10px}.chk{display:flex;align-items:center;gap:6px;font-weight:400;color:var(--testo);font-size:13px;margin:0}.chk input{width:auto;margin:0}
.regole li{margin:6px 0 6px 18px;font-size:15px}
</style>
</head>

// Tempo al km in decimi di secondo: 1'12"1 -> 721
function parseTempo(s){
  const m = String(s||'').trim().match(/^(\d)\D+(\d{1,2})\D+(\d)\D*$/) || String(s||'').trim().match(/^(\d)(\d{2})(\d)$/);
  if (!m) return null; const sec = +m[2]; if (sec > 59) return null;
  return (+m[1])*600 + sec*10 + (+m[3]);
}
const fmtTempo = d => d==null ? '' : `${Math.floor(d/600)}'${String(Math.floor((d%600)/10)).padStart(2,'0')}"${d%10}`;
const fmtDiff = d => d==null ? '-' : (d/10).toFixed(1).replace('.',',') + '"';
function effettivi(p, c){
  const e = [p.primo, p.secondo, p.terzo], rit = c.ritirati || []; let usata = false;
  for (let i=0;i<3;i++) if (e[i]!=null && rit.includes(e[i]) && !usata && p.riserva!=null && !rit.includes(p.riserva)) { e[i] = p.riserva; usata = true; }
  return e;
}

// ---------- AUTH ----------
function setTab(t){
  $('tabLogin').classList.toggle('on', t==='login'); $('tabReg').classList.toggle('on', t==='reg');
  $('formLogin').classList.toggle('hidden', t!=='login'); $('formReg').classList.toggle('hidden', t!=='reg'); msg('authMsg','');
}
async function login(e){
  e.preventDefault(); msg('authMsg','');
  const { error } = await sb.auth.signInWithPassword({ email: $('lEmail').value.trim(), password: $('lPass').value });
  if (error) msg('authMsg', error.message.includes('Invalid') ? 'Email o password errati' : error.message.includes('confirm') ? 'Conferma prima la tua email (controlla la posta)' : error.message);
}
async function register(e){
  e.preventDefault(); msg('authMsg','');
  const username = $('rUser').value.trim();
  const { data: libero } = await sb.rpc('username_libero', { u: username });
  if (libero === false) return msg('authMsg','Nome utente già preso');
  const { data, error } = await sb.auth.signUp({ email: $('rEmail').value.trim(), password: $('rPass').value, options: { data: { username }, emailRedirectTo: location.origin + location.pathname } });
  if (error) return msg('authMsg', error.message.includes('registered') ? 'Email già registrata' : error.message);
  if (!data.session) { setTab('login'); msg('authMsg','Account creato! Controlla la tua email per confermare, poi accedi.','ok'); }
}
async function resetPass(e){
  e.preventDefault();
  const email = $('lEmail').value.trim();
  if (!email) return msg('authMsg','Scrivi prima la tua email nel campo sopra');
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  msg('authMsg', error ? error.message : 'Ti abbiamo mandato una email per reimpostare la password', error ? 'err' : 'ok');
}
async function logout(){ if (presenza) { await presenza.untrack(); sb.removeChannel(presenza); presenza = null; } await sb.auth.signOut(); }

// ---------- UTENTI ONLINE ----------
let presenza = null, onlineList = [];
function avviaPresenza(){
  if (presenza) return;
  presenza = sb.channel('fantatrotto-online', { config: { presence: { key: me.id } } });
  presenza.on('presence', { event: 'sync' }, () => {
    const st = presenza.presenceState();
    onlineList = Object.values(st).map(a => a[0]).filter(Boolean).sort((a,b) => a.username.localeCompare(b.username));
    aggiornaOnline();
  }).subscribe(async status => {
    if (status === 'SUBSCRIBED') await presenza.track({ user_id: me.id, username: profilo.username, admin: !!profilo.is_admin });
  });
}
function aggiornaOnline(){
  $('onlineBtn').textContent = `🟢 ${onlineList.length} online`;
  $('onlinePanel').innerHTML = `<div class="online-list"><b>Utenti online ora (${onlineList.length})</b>${onlineList.map(u => `<div><span class="dot"></span>${esc(u.username)}${u.user_id===me.id?' <span class="muted">(tu)</span>':''}${u.admin?' <span class="muted">· admin</span>':''}</div>`).join('')}</div>`;
}
function toggleOnline(){ $('onlinePanel').classList.toggle('hidden'); }

sb.auth.onAuthStateChange(async (ev, session) => {
  if (ev === 'PASSWORD_RECOVERY') {
    const np = prompt('Scrivi la nuova password (min 6 caratteri)');
    if (np) { const { error } = await sb.auth.updateUser({ password: np }); alert(error ? error.message : 'Password aggiornata!'); }
  }
  if (session?.user) { if (me?.id !== session.user.id) { me = session.user; await avvia(); } }
  else { me = null; $('adminBtn').classList.add('hidden'); document.body.classList.remove('is-admin'); $('app').classList.add('hidden'); $('auth').classList.remove('hidden'); mostraIscrizioni(); mostraSponsor(); }
});

// ---------- COMPETIZIONI ----------
const fmtDataOra = d => new Date(d).toLocaleString('it-IT', { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
function toLocalInput(d){ if (!d) return ''; const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0,16); }
function statoComp(c){
  if (!c) return 'chiuse'; const now = new Date();
  if (c.iscrizioni_apertura && now < new Date(c.iscrizioni_apertura)) return 'prima';
  if (c.iscrizioni_chiusura && now > new Date(c.iscrizioni_chiusura)) return 'chiuse';
  return 'aperte';
}
function testoStato(c){
  const st = statoComp(c);
  if (st === 'prima') return `🕒 Iscrizioni dalle <b>${fmtDataOra(c.iscrizioni_apertura)}</b>${c.iscrizioni_chiusura?` alle <b>${fmtDataOra(c.iscrizioni_chiusura)}</b>`:''}`;
  if (st === 'aperte') return `✅ Iscrizioni aperte${c.iscrizioni_chiusura?` fino alle <b>${fmtDataOra(c.iscrizioni_chiusura)}</b>`:''}`;
  return '⛔ Iscrizioni chiuse, competizione in corso';
}
const compCorrente = () => competizioni.find(c => c.id === compSel);
async function mostraIscrizioni(){
  const { data } = await sb.from('competizioni').select('*').order('created_at', { ascending:false });
  const aperte = (data || []).filter(c => statoComp(c) !== 'chiuse');
  $('iscrInfo').innerHTML = aperte.map(c => `<div class="msg ${statoComp(c)==='aperte'?'ok':'err'}">🏆 <b>${esc(c.nome)}</b>: ${testoStato(c).replace(/^\S+ /,'')}</div>`).join('');
}
function renderBarraComp(){
  const c = compCorrente();
  if (!c) { $('compBar').innerHTML = competizioni.length ? '' : '<div class="card muted" style="margin:0">Nessuna competizione attiva al momento.</div>'; return; }
  const sono = iscritti.has(me.id), st = statoComp(c);
  const azione = sono ? `<span class="badge b-aperta">✅ Iscritto</span>`
    : st === 'aperte' ? `<button class="btn-oro" style="padding:8px 14px" onclick="iscrivitiComp()">Iscriviti</button>`
    : `<span class="badge b-fine">Non iscritto</span>`;
  const sel = competizioni.length > 1 ? `<select onchange="cambiaComp(this.value)" style="margin:0 0 8px">${competizioni.map(x => `<option value="${x.id}" ${x.id===compSel?'selected':''}>${esc(x.nome)}</option>`).join('')}</select>` : '';
  $('compBar').innerHTML = `<div class="card" style="margin:0">${sel}<div class="row" style="align-items:center"><div style="flex:3"><b style="font-family:'Bebas Neue';font-size:24px;color:var(--verde)">🏆 ${esc(c.nome)}</b>
    <div class="muted" style="font-size:13px">${testoStato(c)} · ${iscritti.size} iscritti</div></div><div style="flex:0;white-space:nowrap">${azione}</div></div>
    ${!sono && st !== 'aperte' ? `<p class="muted" style="font-size:13px;margin-top:6px">Puoi seguire classifica e pronostici, ma per giocare aspetta la prossima competizione con iscrizioni aperte.</p>` : ''}</div>`;
}
async function iscrivitiComp(){
  const { error } = await sb.from('partecipanti').insert({ competizione_id: compSel, user_id: me.id });
  if (error) return alert(error.message.includes('row-level') ? 'Iscrizioni chiuse per questa competizione' : error.message);
  await carica(); go(paginaAttuale);
}
function cambiaComp(id){ compSel = +id; try { localStorage.setItem('ft_comp', id); } catch(e){} applicaComp(); go(paginaAttuale); }
function applicaComp(){
  const c = compCorrente();
  CORSE_CLASSIFICA = c?.corse_classifica || 10;
  giornate = giornateAll.filter(g => g.competizione_id === compSel);
  const gid = new Set(giornate.map(g => g.id));
  corse = corseAll.filter(x => gid.has(x.giornata_id));
  scontri = scontriAll.filter(x => x.competizione_id === compSel);
  iscritti = new Set(partecipanti.filter(x => x.competizione_id === compSel).map(x => x.user_id));
  renderBarraComp();
}
async function salvaComp(){
  const a = $('iA').value, c = $('iC').value;
  if (a && c && new Date(c) <= new Date(a)) return msg('iMsg', 'La chiusura deve essere dopo l\'apertura');
  const nc = parseInt($('iN').value, 10);
  if (!(nc >= 1 && nc <= 100)) return msg('iMsg', 'Numero corse a classifica non valido');
  const nome = $('iNome').value.trim(); if (!nome) return msg('iMsg', 'Scrivi il nome della competizione');
  const { error } = await sb.from('competizioni').update({ nome, corse_classifica: nc, iscrizioni_apertura: a ? new Date(a).toISOString() : null, iscrizioni_chiusura: c ? new Date(c).toISOString() : null }).eq('id', compSel);
  if (error) return msg('iMsg', error.message);
  await carica(); renderAdmin(); msg('iMsg', 'Competizione salvata ✅', 'ok');
}
async function nuovaComp(){
  const nome = prompt('Nome della nuova competizione (es. T10 Coppa Inverno):'); if (!nome?.trim()) return;
  const { data, error } = await sb.from('competizioni').insert({ nome: nome.trim() }).select().single();
  if (error) return alert(error.message);
  compSel = data.id; try { localStorage.setItem('ft_comp', data.id); } catch(e){}
  await carica(); renderAdmin(); alert('Competizione creata! Ora imposta le date di iscrizione e salva.');
}
async function eliminaComp(){
  const c = compCorrente(); if (!c) return;
  if (prompt(`ATTENZIONE: elimini "${c.nome}" con tutte le sue giornate, corse, pronostici e tabellone.\nScrivi ELIMINA per confermare:`) !== 'ELIMINA') return;
  const { error } = await sb.from('competizioni').delete().eq('id', c.id);
  if (error) return alert(error.message);
  compSel = null; await carica(); renderAdmin();
}
async function togliPartecipante(uid){
  if (!confirm(`Togliere ${utenti[uid]} da questa competizione?`)) return;
  await sb.from('partecipanti').delete().eq('competizione_id', compSel).eq('user_id', uid);
  await carica(); renderAdmin();
}
async function aggiungiPartecipante(){
  const uid = $('addUser').value; if (!uid) return;
  const { error } = await sb.from('partecipanti').insert({ competizione_id: compSel, user_id: uid });
  if (error) return alert(error.message);

}

async function avvia(){
  $('auth').classList.add('hidden'); $('app').classList.remove('hidden');

  profilo = p || { username: me.email, is_admin: false };
  $('chip').innerHTML = `👤 ${esc(profilo.username)} · <a href="#" onclick="logout()" style="color:var(--oro)">esci</a>`;
  $('adminBtn').classList.toggle('hidden', !profilo.is_admin); document.body.classList.toggle('is-admin', !!profilo.is_admin);
  avviaPresenza(); mostraSponsor();
  await carica(); go('portale');
}
async function carica(){
  const [g, c, pr] = await Promise.all([
    sb.from('giornate').select('*').order('data', { ascending: false }),
    sb.from('corse').select('*').order('orario'),
    sb.from('pronostici').select('*').eq('user_id', me.id)
  ]);
  const [sc, pf, co, pa] = await Promise.all([ sb.from('scontri').select('*').order('turno').order('slot'), sb.from('profiles').select('id,username'),
    sb.from('competizioni').select('*').order('created_at', { ascending:false }), sb.from('partecipanti').select('*') ]);
  scontriAll = sc.data || []; utenti = {}; (pf.data || []).forEach(u => utenti[u.id] = u.username);
  giornateAll = g.data || []; corseAll = c.data || []; miei = {};
  competizioni = co.data || []; partecipanti = pa.data || [];
  (pr.data || []).forEach(x => miei[x.corsa_id] = x);
  if (!competizioni.some(x => x.id === compSel)) {

function calcPunti(p, c){
  const a = c.arrivo; if (!a?.length) return 0; let t = 0; const top = a.slice(0,3), rot = c.rotture || [], v = [10,7,5];

}

// Classifica calcolata con la scala di spareggi
async function classificaCalcolata(giornataId){
  const cs = corse.filter(c => c.fase !== 'scontri' && c.arrivo?.length && (!giornataId || c.giornata_id == giornataId))
                  .sort((a,b) => new Date(b.orario) - new Date(a.orario)); // dalla più recente
  const idx = {}; cs.forEach((c,i) => idx[c.id] = i);
  let rows = [];
  if (cs.length) { const { data } = await sb.from('pronostici_punti').select('*').in('corsa_id', cs.map(c => c.id)).limit(10000); rows = data || []; }
  const by = {};
  const S = (id, nome) => by[id] ??= { user_id:id, username: utenti[id] || nome || '?', punti:0, corse_giocate:0, vincenti:0, esatti:0, bonus:0, rotture:0, seq: cs.map(() => 0), ultimo: Infinity };
  if (!giornataId) iscritti.forEach(id => S(id));
  rows.forEach(r => {
    const k = idx[r.corsa_id]; if (k == null || !iscritti.has(r.user_id)) return;
    const c = cs[k], u = S(r.user_id, r.username), a = c.arrivo, rot = c.rotture || [], e = effettivi(r, c);
    u.punti += r.punti; u.seq[k] = r.punti; u.corse_giocate++;
    e.forEach((n,i) => { if (n == null) return; if (rot.includes(n)) u.rotture++; else if (n == a[i]) u.esatti++; });
    if (e[0] == a[0]) u.vincenti++;
    if (e[0] == a[0] && r.tempo != null && r.tempo == c.tempo_ufficiale) u.bonus++;
    if (k === 0) u.ultimo = new Date(r.updated_at).getTime() || Infinity;
  });
  return Object.values(by).sort(confrontaClassifica);
}
function confrontaClassifica(a, b){
  const d = (b.punti - a.punti) || (b.vincenti - a.vincenti) || (b.esatti - a.esatti) || (b.bonus - a.bonus) || (a.rotture - b.rotture);
  if (d) return d;
  for (let i = 0; i < a.seq.length; i++) if (a.seq[i] !== b.seq[i]) return b.seq[i] - a.seq[i];
  return a.ultimo === b.ultimo ? 0 : (a.ultimo < b.ultimo ? -1 : 1);
}
async function renderClassifica(){
  const data = await classificaCalcolata();
  const opts = giornate.map(g => `<option value="${g.id}">${esc(g.nome)}</option>`).join('');
  $('pg-classifica').innerHTML = `<h2 style="color:var(--verde);font-size:28px;margin-bottom:8px">🏆 Classifica</h2>
    <select id="clSel" onchange="cambiaClassifica()"><option value="">Generale</option>${opts}</select>
    <div class="card" id="clTab">${tabellaCl(data)}</div>`;
}
function tabellaCl(rows){

  return `<table><tr><th>#</th><th>Utente</th><th class="n">Vinc.</th><th class="n">Esatti</th><th class="n">Punti</th></tr>${rows.map((r,i)=>`<tr class="${r.user_id===me.id?'me':''}"><td class="${i===0?'pos1':''}">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</td><td>${esc(r.username)}</td><td class="n">${r.vincenti}</td><td class="n">${r.esatti}</td><td class="n">${r.punti}</td></tr>`).join('')}</table>
  <p class="muted" style="margin-top:8px">A pari punti: più vincenti, più piazzamenti esatti, più bonus +20, meno rotture, miglior punteggio nelle ultime corse, pronostico inserito prima (vedi Regole).</p>`;

  $('pg-scontri').innerHTML = `<h2 style="color:var(--verde);font-size:28px;margin-bottom:8px">⚔️ Scontri diretti</h2>

    ${keys.map(k => `<div class="card"><h3 style="font-size:24px;color:var(--verde)">${NOMI_TURNO[t[k].length] || ('Turno '+k)}</h3>${t[k].map(cardMatch).join('')}</div>`).join('')}`;

function adminScontri(){

  const fatte = corse.filter(c => c.fase !== 'scontri' && c.arrivo?.length).length;
  let corpo = '';
  if (!keys.length) {
    corpo = `<p class="muted">Corse a classifica concluse: <b>${fatte}/${CORSE_CLASSIFICA}</b>. Quando sono finite, crea il tabellone dalla classifica attuale.</p>

    const opzioni = corse.filter(c => c.fase === 'scontri').map(c => `<option value="${c.id}" ${ms[0].corsa_id===c.id?'selected':''}>${c.numero}ª ${esc(c.ippodromo)} · ${fmtData(c.orario)} ${fmtOra(c.orario)}${c.arrivo?.length?' ✅':''}</option>`).join('');

async function generaTabellone(){
  const lista = await classificaCalcolata(); let N = 16; while (N > lista.length) N /= 2;
  if (N < 2) return msg('sMsg','Servono almeno 2 iscritti');
  const fatte = corse.filter(c => c.fase !== 'scontri' && c.arrivo?.length).length;
  if (!confirm(`Creare il tabellone con i primi ${N} della classifica?${fatte < CORSE_CLASSIFICA ? `\n\nAttenzione: corse a classifica concluse ${fatte}/${CORSE_CLASSIFICA}.` : ''}`)) return;
  const seeds = seedOrder(N), righe = [];
  for (let i = 0; i < N/2; i++) righe.push({ competizione_id: compSel, turno: 1, slot: i, user1: lista[seeds[2*i]-1].user_id, user2: lista[seeds[2*i+1]-1].user_id });
  const { error } = await sb.from('scontri').insert(righe);
  if (error) return msg('sMsg', error.message);
  await carica(); renderAdmin();
}
async function assegnaCorsa(k){
  const id = +$('sCorsa').value; if (!id) return msg('sMsg','Scegli la corsa');
  const { error } = await sb.from('scontri').update({ corsa_id: id }).eq('turno', k).eq('competizione_id', compSel);
  if (error) return msg('sMsg', error.message);
  await carica(); renderAdmin(); msg('sMsg','Corsa assegnata ✅','ok');
}
function esito(r1, r2){
  // chi è più vicino al tempo ufficiale; a pari distanza chi ha inserito prima
  const key = r => r && r.diff_tempo != null ? [r.diff_tempo, new Date(r.updated_at).getTime()] : [1e12, 1e15];
  const k1 = key(r1), k2 = key(r2), t1 = k1[0] < k2[0] || (k1[0] === k2[0] && k1[1] <= k2[1]);
  const p1 = (r1?.punti || 0) + (t1 && r1 ? 3 : 0), p2 = (r2?.punti || 0) + (!t1 && r2 ? 3 : 0);
  return { p1, p2, w: p1 > p2 ? 1 : p2 > p1 ? 2 : (t1 ? 1 : 2) };
}
async function calcolaTurno(k){
  const ms = turni()[k], cid = ms[0].corsa_id, c = corse.find(x => x.id === cid);
  if (!c) return msg('sMsg','Prima assegna la corsa al turno');
  if (!c.arrivo?.length) return msg('sMsg','Inserisci prima l\'arrivo ufficiale di quella corsa');
  const { data } = await sb.from('pronostici_punti').select('*').eq('corsa_id', cid);
  const pr = {}; (data || []).forEach(r => pr[r.user_id] = r);
  const vincitori = [];
  for (const m of ms) {
    const e = esito(pr[m.user1], pr[m.user2]); const w = e.w === 1 ? m.user1 : m.user2; vincitori[m.slot] = w;
    const { error } = await sb.from('scontri').update({ punti1: e.p1, punti2: e.p2, vincitore: w }).eq('id', m.id);
    if (error) return msg('sMsg', error.message);
  }
  if (ms.length > 1) {
    const righe = []; for (let j = 0; j < ms.length/2; j++) righe.push({ competizione_id: compSel, turno: k+1, slot: j, user1: vincitori[2*j], user2: vincitori[2*j+1] });
    const { error } = await sb.from('scontri').upsert(righe, { onConflict: 'competizione_id,turno,slot' });
    if (error) return msg('sMsg', error.message);
  }
  await carica(); renderAdmin();
}
async function resetTabellone(){
  if (!confirm('Cancellare tutto il tabellone degli scontri diretti?')) return;
  await sb.from('scontri').delete().eq('competizione_id', compSel); await carica(); renderAdmin();
}

const SIGLE_TW = { NAPOLI:'NA', ROMA:'RO', MONTEGIORGIO:'MG', PALERMO:'PA', TREVISO:'TV', BOLOGNA:'BO', CASTELLUCCIO:'CS' };
function linkRisultati(c){
  const base = 'https://www.trottoweb.it/TrottoWeb/php_resp/hRis.php';
  const nome = String(c.ippodromo||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  const sigla = SIGLE_TW[nome] || Object.entries(SIGLE_TW).find(([k]) => nome.includes(k))?.[1];

  const d = new Date(c.orario), data = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

function fotoBlob(file, max = 1400, q = 0.82){
  return new Promise((ok, ko) => {
    const r = new FileReader(); r.onerror = ko;
    r.onload = () => { const img = new Image(); img.onerror = ko; img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? ok(b) : ko(new Error('foto')), 'image/jpeg', q); }; img.src = r.result; };
    r.readAsDataURL(file);
  });
}
async function caricaFile(blob, ext, tipo){
  const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const { error } = await sb.storage.from('mercato').upload(path, blob, { contentType: tipo, upsert: false });
  if (error) throw error;
  return sb.storage.from('mercato').getPublicUrl(path).data.publicUrl;
}
function rimpicciolisci(file, max = 200, q = 0.85){
  return new Promise((ok, ko) => {
    const r = new FileReader(); r.onerror = ko;
    r.onload = () => { const img = new Image(); img.onerror = ko; img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      ok(c.toDataURL('image/jpeg', q)); }; img.src = r.result; };
    r.readAsDataURL(file);
  });
}
const linkOk = l => { l = (l||'').trim(); return l && !/^https?:\/\//i.test(l) ? 'https://' + l : (l || null); };

}

      <div class="picks" style="margin-top:6px">${[1,2,3].map(k=>`<div><label>${k}° arrivato</label><input type="number" inputmode="numeric" min="1" max="30" id="a${k}-${c.id}" placeholder="n°"></div>`).join('')}</div>
      <label>⏱ Tempo al km ufficiale del vincitore</label><input id="at-${c.id}" placeholder="1'12&quot;1">
      <label>Ritirati (numeri separati da virgola)</label><input id="ar-${c.id}" inputmode="numeric" placeholder="es. 4, 11" value="${(c.ritirati||[]).join(', ')}">
      <label>Squalificati per rottura (numeri separati da virgola)</label><input id="ao-${c.id}" inputmode="numeric" placeholder="es. 7" value="${(c.rotture||[]).join(', ')}">
      <button class="btn-oro full" onclick="salvaArrivo(${c.id})">Conferma arrivo</button>${btnRisultati(c)}</div>`).join('') : '<p class="muted">Nessuna corsa in attesa di arrivo.</p>'}</div>
  ${adminScontri()}
  <div class="card"><h3 style="font-size:22px">Gestisci giornate</h3>
    ${giornate.length ? giornate.map(g => { const n = corse.filter(c => c.giornata_id === g.id).length; return `<div class="row" style="border-bottom:1px solid #eee;padding:8px 0"><div style="flex:3"><b>${esc(g.nome)}</b><div class="muted">${fmtData(g.data)} · ${n} ${n===1?'corsa':'corse'}</div></div><button class="btn-rosso" style="flex:0" onclick="eliminaGiornata(${g.id})">🗑</button></div>`; }).join('') : '<p class="muted">Nessuna giornata.</p>'}</div>
  <div class="card"><h3 style="font-size:22px">Gestisci corse</h3>
    ${corse.length ? corse.slice().reverse().map(c => `<div class="row" style="border-bottom:1px solid #eee;padding:8px 0"><div style="flex:3"><b>${c.numero}ª ${esc(c.ippodromo)}</b><div class="muted">${c.fase==='scontri'?'⚔️':'🏆'} ${fmtData(c.orario)} ${fmtOra(c.orario)} · ${c.arrivo?.length?'arrivo: '+c.arrivo.join('-'):'senza arrivo'}</div></div>
      ${c.arrivo?.length?`<button class="btn-ghost" style="flex:0" onclick="annullaArrivo(${c.id})">↺</button>`:''}<button class="btn-rosso" style="flex:0" onclick="eliminaCorsa(${c.id})">🗑</button></div>`).join('') : '<p class="muted">Nessuna corsa.</p>'}</div>`;
}
async function nuovaGiornata(){
  const nome = $('gNome').value.trim(), data = $('gData').value;
  if (!nome || !data) return msg('gMsg','Compila nome e data');
  if (!compSel) return msg('gMsg','Crea prima una competizione');
  const { error } = await sb.from('giornate').insert({ nome, data, competizione_id: compSel });
  if (error) return msg('gMsg', error.message);
  await carica(); renderAdmin(); msg('gMsg','Giornata creata ✅','ok');
}
function leggiPartenti(txt){
  return txt.split('\n').map(r => r.trim()).filter(Boolean).map(r => {
    const m = r.match(/^(\d+)[\s.)\-]+(.+)$/); if (!m) return null;
    const [cav, ...drv] = m[2].split(/\s+-\s+|\s+–\s+/);
    return { n: +m[1], cavallo: cav.trim(), driver: drv.join(' - ').trim() };
  }).filter(Boolean);
}
async function nuovaCorsa(){
  const g = $('cG').value, ora = $('cOra').value, ipp = $('cIpp').value.trim();
  if (!g || !ora || !ipp) return msg('cMsg','Compila giornata, ippodromo e orario');
  const { error } = await sb.from('corse').insert({ giornata_id: +g, ippodromo: ipp, numero: +$('cNum').value || 1, nome: $('cNome').value.trim(), orario: new Date(ora).toISOString(), partenti: [], fase: $('cFase').value });
  if (error) return msg('cMsg', error.message);
  await carica(); renderAdmin(); msg('cMsg', 'Corsa aggiunta ✅', 'ok');
}
async function salvaArrivo(id){
  const a = [1,2,3].map(k => +$(`a${k}-${id}`).value).filter(Boolean);
  if (a.length < 3 || new Set(a).size !== 3) return alert('Scrivi i numeri di 1°, 2° e 3° (tutti diversi)');
  const tempo_ufficiale = parseTempo($('at-'+id).value);
  if (tempo_ufficiale == null) return alert('Scrivi il tempo ufficiale così: 1\'12"1');
  const ritirati = numeri($('ar-'+id).value);
  const rotture = numeri($('ao-'+id).value);
  const { error } = await sb.from('corse').update({ arrivo: a, tempo_ufficiale, ritirati, rotture }).eq('id', id);
  if (error) return alert(error.message); await carica(); renderAdmin();
}
async function annullaArrivo(id){ if (!confirm('Annullare l\'arrivo di questa corsa?')) return; await sb.from('corse').update({ arrivo: null, tempo_ufficiale: null, ritirati: [], rotture: [] }).eq('id', id); await carica(); renderAdmin(); }
async function eliminaGiornata(id){
  const g = giornate.find(x => x.id === id), n = corse.filter(c => c.giornata_id === id).length;
  if (!confirm(`Eliminare la giornata "${g?.nome}"${n ? ` con le sue ${n} corse e tutti i pronostici (spariscono anche dallo storico)` : ''}?`)) return;
  const { error } = await sb.from('giornate').delete().eq('id', id);
  if (error) return alert(error.message);
  await carica(); renderAdmin();
}
async function eliminaCorsa(id){ if (!confirm('Eliminare la corsa e tutti i suoi pronostici? (sparisce anche dallo storico)')) return; await sb.from('corse').delete().eq('id', id); await carica(); renderAdmin(); }
</script>
</body>
